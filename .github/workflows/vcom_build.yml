name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libavformat-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libsdl2-dev \
            libsdl2-ttf-dev

      - name: Clone video-compare repository
        run: |
          git clone https://github.com/pixop/video-compare.git
          cd video-compare

      - name: Build
        run: make

      - name: Verify binary
        run: |
          file video-compare
          ./video-compare --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: video-compare-linux-x86_64
          path: video-compare
